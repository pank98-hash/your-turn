# your-turn bundle patch: mount the skill provider into the host skill
# registry (its row is host-plane, so every agent preset's scope chain merges
# the skill it registers), plus a "learning mode" agent preset that forbids the
# child agent from filling in the blanks or editing tests.
- insert:
    - id: your-turn
      name: '@pank98-hash/your-turn'
      config:
        python: 'python3'
    - id: preset-your-turn-learner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: your-turn-learner
        name: 'Your Turn learner'
        description: '学习模式：只判绿红不补白。'
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '你是学习模式：绝不替用户补上留白或改测试。'
